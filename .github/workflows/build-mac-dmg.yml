name: Build macOS ARM64 DMG

on:
  workflow_dispatch:
  push:
    branches:
      - mac-dmg

permissions:
  contents: write

jobs:
  build-mac-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python setuptools (needed by node-gyp)
        run: python3 -m pip install --break-system-packages setuptools

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Extract version
        id: version
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> "$GITHUB_OUTPUT"

      - name: Build DMG (macOS arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: scalpel-mac-arm64-dmg
          path: |
            dist/*.dmg
            dist/*.blockmap
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-arm64-${{ steps.version.outputs.version }}
          name: Scalpel ${{ steps.version.outputs.version }} (macOS ARM64)
          body: |
            Automated macOS Apple Silicon (arm64) build of Scalpel.
            Built with electron-builder on a macOS 14 arm64 runner.
            Unsigned build; if Gatekeeper blocks it, right-click the app and choose Open.
          files: dist/*.dmg
          draft: false
          prerelease: true
          generate_release_notes: false
