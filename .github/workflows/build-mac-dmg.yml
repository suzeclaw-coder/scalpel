name: Build macOS ARM64 DMG

on:
  workflow_dispatch:
  push:
    branches:
      - mac-dmg

permissions:
  contents: write

jobs:
  build-mac-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python setuptools (needed by node-gyp)
        run: python3 -m pip install --break-system-packages setuptools

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build DMG (macOS arm64, ad-hoc signed)
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: scalpel-mac-arm64-dmg
          path: |
            dist/*.dmg
            dist/*.blockmap
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "Publishing mac-arm64-${VERSION}"
          gh release create "mac-arm64-${VERSION}" dist/*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --title "Scalpel ${VERSION} (macOS ARM64)" \
            --prerelease \
            --notes "Automated macOS Apple Silicon (arm64) build of Scalpel ${VERSION}. Unsigned; if Gatekeeper blocks it, right-click the app and choose Open."
